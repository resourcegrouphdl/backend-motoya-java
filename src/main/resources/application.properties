# Google Calendar (módulo cobranza existente)
app.calendar.id=${CALENDAR_ID:primary}

# Google Calendar - Módulo PROVISIONAL (eliminar junto con calendar/ package)
# Cómo obtener estos valores:
#   1. Ve a Google Cloud Console → IAM → Cuentas de servicio
#   2. Crea/selecciona una SA con permiso "Editor de Google Calendar"
#   3. Descarga la clave JSON y copia los campos correspondientes
#   4. En application-dev.properties coloca los valores reales
#      (nunca commitear la private-key en el repositorio)
#
# Nota sobre private-key:
#   En .properties, los saltos de línea de la clave se escriben como \n
#   Ejemplo: -----BEGIN RSA PRIVATE KEY-----\nMIIE...\n-----END RSA PRIVATE KEY-----\n
#   También se puede usar la variable de entorno GOOGLE_CALENDAR_PRIVATE_KEY

# ─────────────────────────────────────────────────────────────────────────────

google.calendar.project-id=${GOOGLE_CALENDAR_PROJECT_ID:motoya-form}
google.calendar.read-id=${GOOGLE_CALENDAR_PRINCIPAL_ID:}
google.calendar.client-email=${GOOGLE_CALENDAR_CLIENT_EMAIL:}
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.private-key-id=${GOOGLE_CALENDAR_PRIVATE_KEY_ID:}
google.calendar.private-key=${GOOGLE_CALENDAR_PRIVATE_KEY:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_CALENDAR_ID:primary}

# =============================================================================
# RESILIENCIA — Resilience4j
# =============================================================================

# --- Circuit Breaker ----------------------------------------------------------
# metaWa: Meta WhatsApp Cloud API — tolera 50% fallos, espera 30s
resilience4j.circuitbreaker.instances.metaWa.sliding-window-size=10
resilience4j.circuitbreaker.instances.metaWa.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.metaWa.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.metaWa.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.metaWa.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.metaWa.automatic-transition-from-open-to-half-open-enabled=true

# sunat: OSE fiscal — más permisivo (60%) pero espera 60s (evitar bloqueos tributarios)
resilience4j.circuitbreaker.instances.sunat.sliding-window-size=10
resilience4j.circuitbreaker.instances.sunat.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.sunat.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.sunat.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.sunat.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.sunat.automatic-transition-from-open-to-half-open-enabled=true

# documentAi: OCR/extracción — 50% fallos, 30s espera, mínimo 3 llamadas
resilience4j.circuitbreaker.instances.documentAi.sliding-window-size=10
resilience4j.circuitbreaker.instances.documentAi.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.documentAi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.documentAi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.documentAi.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.documentAi.automatic-transition-from-open-to-half-open-enabled=true

# --- Retry --------------------------------------------------------------------
# firestoreTimeout: reintentos con backoff para timeouts gRPC de Firestore
resilience4j.retry.instances.firestoreTimeout.max-attempts=3
resilience4j.retry.instances.firestoreTimeout.wait-duration=500ms
resilience4j.retry.instances.firestoreTimeout.enable-exponential-backoff=true
resilience4j.retry.instances.firestoreTimeout.exponential-backoff-multiplier=2
resilience4j.retry.instances.firestoreTimeout.retry-exceptions=io.grpc.StatusRuntimeException,java.util.concurrent.TimeoutException

# sunatCdr: polling de CDR — hasta 5 intentos con backoff agresivo (2s → 4s → 8s…)
resilience4j.retry.instances.sunatCdr.max-attempts=5
resilience4j.retry.instances.sunatCdr.wait-duration=2s
resilience4j.retry.instances.sunatCdr.enable-exponential-backoff=true
resilience4j.retry.instances.sunatCdr.exponential-backoff-multiplier=2
resilience4j.retry.instances.sunatCdr.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# --- Bulkhead (semáforo, compatible con Reactor/WebFlux) ----------------------
# metaWa: máx 10 llamadas concurrentes
resilience4j.bulkhead.instances.metaWa.max-concurrent-calls=10
resilience4j.bulkhead.instances.metaWa.max-wait-duration=0ms

# sunat: máx 5 concurrentes — SUNAT OSE tiene rate-limit estricto
resilience4j.bulkhead.instances.sunat.max-concurrent-calls=5
resilience4j.bulkhead.instances.sunat.max-wait-duration=0ms

# documentAi: máx 3 concurrentes — Document AI es costoso y lento
resilience4j.bulkhead.instances.documentAi.max-concurrent-calls=3
resilience4j.bulkhead.instances.documentAi.max-wait-duration=0ms

# --- TimeLimiter --------------------------------------------------------------
# sunat: 30s (procesamiento XML + firma digital OSE)
resilience4j.timelimiter.instances.sunat.timeout-duration=30s
resilience4j.timelimiter.instances.sunat.cancel-running-future=true

# documentAi: 15s (inference del modelo)
resilience4j.timelimiter.instances.documentAi.timeout-duration=15s
resilience4j.timelimiter.instances.documentAi.cancel-running-future=true

# metaWa: 10s (llamada HTTP a Meta Graph API)
resilience4j.timelimiter.instances.metaWa.timeout-duration=10s
resilience4j.timelimiter.instances.metaWa.cancel-running-future=true

# --- Actuator: exponer métricas y health de Resilience4j ---------------------
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries,bulkheads
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true
management.health.retryevents.enabled=true

# =============================================================================
# MÓDULO NOTIFICACIONES
# =============================================================================

# --- Email (JavaMail) ---------------------------------------------------------
# Configurar en application-dev.properties con valores reales
spring.mail.host=${MAIL_HOST:mail.motoya.com.pe}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:notificaciones@motoya.com.pe}
spring.mail.password=${MAIL_PASSWORD:motoyadigital}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Meta WhatsApp Cloud API se configura arriba (notifications.meta.*)

# --- Webhook debug -----------------------------------------------------------
# true  → loguea el payload raw completo en INFO (activar durante primeras pruebas)
# false → solo loguea mensajes parseados (modo producción estable)
notifications.webhook.debug-payload=${WEBHOOK_DEBUG_PAYLOAD:true}
# Token de seguridad para el webhook público /webhook/whatsapp (query param ?token=X)
# Dejar vacío en dev. En prod configurar WEBHOOK_TOKEN como variable de entorno.
notifications.webhook.token=${WEBHOOK_TOKEN:}

# --- Scheduler del Outbox Outbox Pattern -------------------------------------
# Intervalo entre ciclos de procesamiento de eventos pendientes (ms)
notifications.scheduler.delay-ms=30000
# Scheduler deshabilitado: se usa Cloud Function + Cloud Scheduler como trigger externo
notifications.scheduler.enabled=false
# Token secreto para el endpoint interno (sobreescribir con env var en prod)
notifications.internal.token=${NOTIFICATIONS_INTERNAL_TOKEN:cambiar-en-prod-123}

# =============================================================================
# MÓDULO COBRANZAS — Configuración de flujos automáticos
# =============================================================================
# Auto-inicio de caso: cuando un contrato llega a COMPLETADO, IniciarCasoEventHandler
# crea el caso de cobranza automáticamente.
# false (default) = dry_run: solo loguea, no persiste — activar en prod tras validar logs
# true            = modo real
cobranzas.auto-iniciar-caso.enabled=${AUTO_INICIAR_CASO:false}

# =============================================================================
# MÓDULO CONTABILIDAD — Ledger contable y scheduler de sincronización
# =============================================================================
# Intervalo entre ciclos de sincronización (ms). Default: 6 horas = 21.600.000 ms
contabilidad.scheduler.delay-ms=21600000
# Activar/desactivar el scheduler automático
contabilidad.scheduler.enabled=true

# =============================================================================
# MÓDULO ALERTAS CENTER — Centro de Notificaciones Internas
# =============================================================================
# Token secreto que envían las Cloud Functions al endpoint /api/v1/alertas/evento
alertas.internal.token=${ALERTAS_INTERNAL_TOKEN:}

# Colecciones Firestore (el sufijo _dev se elimina en producción)
alertas.collections.alertas=alertas_internas
alertas.collections.solicitudes=solicitudes
alertas.collections.clientes=clientes_v1
alertas.collections.tiendas=tienda_profiles
alertas.collections.contratos=contratos
alertas.collections.tokens-fcm=tokens_fcm

# =============================================================================
# FACTILIZA — Verificación de identidad (DNI / CEE / Licencia)
# =============================================================================
# Token de API: https://api.factiliza.com
# Obtener token: Panel de control Factiliza → API Keys
app.factiliza.base-url=https://api.factiliza.com/v1
app.factiliza.token=${FACTILIZA_TOKEN:}

# =============================================================================
# MÓDULO MIGRACIÓN ASISTIDA
# =============================================================================
# ID del calendario "clientes" de motoyadigital@gmail.com
# Obtener: Google Calendar → Configuración del calendario "clientes" → ID del calendario
migracion.calendar-id=${MIGRACION_CALENDAR_ID:}
# colorIds de Google Calendar que indican cuota pagada (2=Sage verde, 10=Basil verde oscuro)
migracion.color-pagado-ids=2,10

# =============================================================================
# MÓDULO VOUCHER EXTRACTION — Extracción enriquecida de comprobantes
# =============================================================================

# --- Anthropic / Claude Haiku (enriquecimiento LLM) --------------------------
# Obtener API key: https://console.anthropic.com
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=claude-haiku-4-5-20251001
# Deshabilitar para entornos sin acceso a Anthropic (fallback a solo regex)
app.anthropic.enabled=${ANTHROPIC_ENABLED:true}

# --- Circuit Breaker: Claude Haiku -------------------------------------------
# Más permisivo que Document AI (60%) — fallos de LLM no son críticos
resilience4j.circuitbreaker.instances.claudeEnriquecimiento.sliding-window-size=10
resilience4j.circuitbreaker.instances.claudeEnriquecimiento.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.claudeEnriquecimiento.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.claudeEnriquecimiento.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.claudeEnriquecimiento.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.claudeEnriquecimiento.automatic-transition-from-open-to-half-open-enabled=true

# --- TimeLimiter: Claude Haiku -----------------------------------------------
# 20s — LLM puede ser lento en picos de carga
resilience4j.timelimiter.instances.claudeEnriquecimiento.timeout-duration=20s
resilience4j.timelimiter.instances.claudeEnriquecimiento.cancel-running-future=true

# --- Bulkhead: Claude Haiku --------------------------------------------------
# Máx 5 llamadas concurrentes — no saturar Anthropic API
resilience4j.bulkhead.instances.claudeEnriquecimiento.max-concurrent-calls=5
resilience4j.bulkhead.instances.claudeEnriquecimiento.max-wait-duration=0ms

