 vale la gravacion =spring.application.name=backendMotoya
server.port=${PORT:8080}

spring.profiles.active=dev
logging.level.root=INFO
app.env=DEV

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Error responses — incluir el mensaje de excepción para diagnóstico (no exponer en prod)
server.error.include-message=always

# Firebase
firebase.project-id=motoya-form

# Firestore (Spring Cloud GCP)
spring.cloud.gcp.firestore.project-id=motoya-form

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Thymeleaf
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# GCS - Firebase Storage bucket (motoya-form.appspot.com)
app.gcs.bucket-name=motoya-form.appspot.com

# =============================================================================
# MÓDULO FINANZAS — Document AI
# =============================================================================
# Crear el procesador en: https://console.cloud.google.com/ai/document-ai
# Tipo recomendado: "Form Parser" (procesa tanto facturas como vouchers bancarios)
# Habilitar Document AI API: gcloud services enable documentai.googleapis.com
app.documentai.project-id=motoya-form
app.documentai.location=us
# Copiar el ID del procesador desde Google Cloud Console → Document AI → Processors
app.documentai.processor-id=${DOCUMENTAI_PROCESSOR_ID:}
# Poner en false hasta tener el procesador creado y configurado
app.documentai.enabled=${DOCUMENTAI_ENABLED:true}

# Notificaciones WhatsApp del módulo de cobranzas (pago de facturas a tiendas)
# Poner en true cuando el flujo de mensajes esté pulido
app.notifications.cobranzas.enabled=${NOTIF_COBRANZAS_ENABLED:false}

# Meta WhatsApp Cloud API
# Obtener desde Meta Business Manager → WhatsApp → Configuración de la API
# notifications.meta.phone-number-id=${META_WA_PHONE_NUMBER_ID:}
# notifications.meta.access-token=${META_WA_ACCESS_TOKEN:}
notifications.meta.api-version=v21.0
notifications.meta.webhook-verify-token=${META_WA_WEBHOOK_VERIFY_TOKEN:motoya-meta-verify}
notifications.meta.phone-number-id=1156572900879077
notifications.meta.access-token=EAAXOu3JwjbkBRprJxu2glRovmMWx4eoqDCYSX98Ftc1zXlK9h2ODvr2rLRHwjqXGZBkYpuHbUFZAXpwZBagrUbhZCZBxgqNOjMfD19zRBIuJZCcTnXwcKOypO7TnRZBN3BZAmvcLsXX3T9hZBAX5agCNy4Gx4MsIvtYmTWyvMMOqQa8iUiMmQ2Hb7ZB7dgZBu58LEO0swZDZD
